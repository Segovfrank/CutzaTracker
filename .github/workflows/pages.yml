# Publishes the static showcase (reservoir-storage-eo/website) to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Refresh the data first with `python -m website.export` and commit website/data.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "reservoir-storage-eo/website/**"
      - "reservoir-storage-eo/Project_Overview.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the static site
        run: |
          mkdir _site
          cp -r reservoir-storage-eo/website/. _site/
          cp reservoir-storage-eo/Project_Overview.md _site/
          # The Python server and exporter don't run on Pages
          rm -rf _site/*.py _site/__pycache__
          test -f _site/data/history.json || { echo "Run python -m website.export and commit website/data first"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
