[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cutzamala_eo"
version = "0.0.1"
description = "Estimate the water levels of the Cutzamala System by fetching Satellite Images from Copernicus and feeding it to a TensorFlow Model. The model is trained and validated with historical data from prior years, when Conagua released the official info."
authors = [
  { name = "Francisco Segovia" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["cutzamala_eo"]
include = ["pyproject.toml", "cutzamala_eo/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["cutzamala_eo"]
force-sort-within-sections = true

